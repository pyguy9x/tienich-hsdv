<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Quản lý hồ sơ – Rà soát (tiện ích v0.8.5)</title>
<style>
  :root { --do:#b91c1c; --xanh:#15803d; --nen:#f8fafc; --vien:#d1d5db; --chu:#1f2937; --mo:#6b7280; }
  * { box-sizing: border-box; }
  body { margin:0; font:14px/1.45 "Segoe UI",Arial,sans-serif; background:var(--nen); color:var(--chu); }
  header { background:linear-gradient(90deg,#b91c1c,#dc2626); color:#fff; padding:14px 20px; }
  header h1 { margin:0; font-size:20px; }
  header p { margin:2px 0 0; font-size:12px; opacity:.9; }
  main { max-width:1280px; margin:0 auto; padding:14px; }
  .the { background:#fff; border:1px solid var(--vien); border-radius:10px; padding:12px 14px; margin-bottom:12px; }
  .hang { display:flex; flex-wrap:wrap; gap:8px; align-items:center; }
  input, select, button { font:inherit; padding:6px 9px; border:1px solid var(--vien); border-radius:6px; background:#fff; }
  button { cursor:pointer; font-weight:600; }
  button.chinh { background:var(--do); border-color:var(--do); color:#fff; }
  button.xanh { background:var(--xanh); border-color:var(--xanh); color:#fff; }
  button.nho { padding:3px 8px; font-size:12px; }
  button:disabled { opacity:.5; cursor:not-allowed; }
  .tong { display:grid; grid-template-columns:repeat(auto-fit,minmax(150px,1fr)); gap:8px; margin-bottom:12px; }
  .o { background:#fff; border:1px solid var(--vien); border-radius:10px; padding:10px 12px; }
  .o b { display:block; font-size:22px; }
  .o span { font-size:12px; color:var(--mo); }
  .o.can b { color:var(--do); } .o.tot b { color:var(--xanh); }
  .tabs { display:flex; gap:4px; margin-bottom:10px; flex-wrap:wrap; }
  .tabs button { border-radius:6px 6px 0 0; }
  .tabs button.on { background:var(--do); color:#fff; border-color:var(--do); }
  table { width:100%; border-collapse:collapse; background:#fff; }
  th, td { border:1px solid var(--vien); padding:6px 8px; text-align:left; vertical-align:top; }
  th { background:#f1f5f9; position:sticky; top:0; z-index:1; cursor:pointer; white-space:nowrap; }
  tr.hs { cursor:pointer; } tr.hs:hover { background:#fef2f2; }
  .nhan { display:inline-block; padding:1px 7px; border-radius:10px; font-size:12px; font-weight:600; white-space:nowrap; }
  .nhan.chua { background:#e5e7eb; color:#374151; } .nhan.tu { background:#fef3c7; color:#92400e; }
  .nhan.xong { background:#dcfce7; color:#166534; } .nhan.tay { background:#ede9fe; color:#5b21b6; }
  .nhan.trung { background:#fee2e2; color:#991b1b; }
  .ct { background:#fffbeb; }
  .ct td { padding:10px 14px; }
  .muc { display:flex; gap:8px; align-items:flex-start; padding:4px 0; border-bottom:1px dashed #e5e7eb; }
  .muc.da { opacity:.5; text-decoration:line-through; }
  .muc small { color:var(--mo); display:block; text-decoration:none; }
  .loai { font-size:11px; font-weight:700; padding:1px 6px; border-radius:4px; background:#fee2e2; color:#991b1b; white-space:nowrap; }
  .loai.md { background:#e0f2fe; color:#075985; } .loai.loi { background:#fef3c7; color:#92400e; }
  .nhom { border:2px solid var(--vien); border-radius:10px; margin-bottom:10px; background:#fff; }
  .nhom h3 { margin:0; padding:8px 12px; background:#fef2f2; font-size:14px; border-radius:8px 8px 0 0; }
  .nhom.bo { opacity:.55; }
  .thongbao { padding:8px 12px; border-radius:6px; margin:8px 0; font-size:13px; }
  .thongbao.ok { background:#dcfce7; color:#166534; } .thongbao.loi { background:#fee2e2; color:#991b1b; }
  .mo { color:var(--mo); font-size:12px; }
  @media (max-width:700px){ th:nth-child(n+6), td:nth-child(n+6){ display:none; } }
</style>
</head>
<body>
<header>
  <h1>Quản lý hồ sơ đảng viên – Rà soát</h1>
  <p>Trang dành cho team rà soát: theo dõi hồ sơ đã nhập, các mục AI cân nhắc/chưa điền, và lọc hồ sơ trùng.</p>
</header>
<main>
  <div class="the">
    <div class="hang">
      <input id="secret" type="password" placeholder="Mã bí mật cơ sở dữ liệu" style="width:220px">
      <input id="nguoi" placeholder="Tên người rà soát" style="width:200px">
      <button class="chinh" id="tai">⟳ Tải dữ liệu</button>
      <button id="xuatDs">⬇ Xuất danh sách (CSV)</button>
      <button id="xuatMuc">⬇ Xuất các mục rà soát (CSV)</button>
      <span class="mo" id="lanTai"></span>
    </div>
    <div id="tb"></div>
  </div>

  <div class="tong" id="tong"></div>

  <div class="tabs">
    <button data-tab="ds" class="on">Tất cả hồ sơ</button>
    <button data-tab="rs">Cần rà soát</button>
    <button data-tab="nhap">Đã nhập</button>
    <button data-tab="trung">Hồ sơ trùng <span id="slTrung"></span></button>
  </div>

  <div id="locKhu" class="the">
    <div class="hang">
      <input id="tim" placeholder="Tìm theo tên, CCCD, mã, người nhập…" style="flex:1;min-width:220px">
      <select id="loTT">
        <option value="">Mọi trạng thái</option>
        <option value="chua">Chưa nhập</option>
        <option value="tu">Đã nhập tự động – chờ rà soát</option>
        <option value="xong">Đã rà soát</option>
      </select>
      <select id="loNguoi"><option value="">Mọi người nhập</option></select>
      <label><input type="checkbox" id="loTay"> Chỉ văn bản viết tay</label>
      <label><input type="checkbox" id="loCon"> Chỉ hồ sơ còn mục chưa xử lý</label>
    </div>
  </div>

  <div id="khuDs"></div>
  <div id="khuTrung" hidden></div>
</main>

<script src="quanly.js"></script>
</body>
</html>
